name: bancaemdia-frontend-staging

services:
  frontend:
    image: ${FRONTEND_IMAGE:?provide an approved image digest}
    user: '101:101'
    read_only: true
    volumes:
      - type: bind
        source: ${FRONTEND_CONFIG_FILE:?provide the release configuration}
        target: /usr/share/nginx/html/config.json
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    networks:
      edge:
        aliases:
          - frontend-staging

networks:
  edge:
    external: true
    name: bancaemdia_edge
