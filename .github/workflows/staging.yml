name: Homologação do frontend

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: ID da CI de push da main cujo artefato será promovido
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  packages: write

concurrency:
  group: frontend-staging
  cancel-in-progress: false

jobs:
  staging:
    name: Promover artefato para homologação
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_ORIGIN }}
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      STAGING_ENABLED: ${{ vars.STAGING_ENABLED }}
      STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
      STAGING_API_SHA: ${{ vars.STAGING_API_SHA }}
      STAGING_API_IMAGE: ${{ vars.STAGING_API_IMAGE }}
      STAGING_ISSUER: ${{ vars.STAGING_ISSUER }}
      STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Validar ambiente, contrato integrado e CI no SHA escolhido
        id: release
        run: node scripts/staging-release.mjs prepare
      - name: Preparar ferramentas de smoke antes da promoção
        run: |
          npm install --global pnpm@10.34.6
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Baixar e verificar digest do artefato antes de extraí-lo
        env:
          ARTIFACT_ID: ${{ steps.release.outputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > .staging-release/artifact.zip
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const release = JSON.parse(await readFile('.staging-release/release.json', 'utf8'));
          const actual = 'sha256:' + createHash('sha256').update(await readFile('.staging-release/artifact.zip')).digest('hex');
          if (actual !== release.artifact_digest) throw new Error('Digest do artefato não confere.');
          JS
          python3 deploy/staging/unpack.py .staging-release/artifact.zip .staging-artifact
          node scripts/staging-release.mjs package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Empacotar os mesmos bytes aprovados, sem recompilar
        env:
          FRONTEND_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --push --provenance=true \
            --file deploy/staging/Dockerfile --build-arg "FRONTEND_SHA=$FRONTEND_SHA" \
            --tag "ghcr.io/$GITHUB_REPOSITORY:staging-$FRONTEND_SHA" \
            --metadata-file .staging-release/image.json .staging-artifact
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          const release = JSON.parse(await readFile('.staging-release/release.json', 'utf8'));
          const image = JSON.parse(await readFile('.staging-release/image.json', 'utf8'));
          const digest = image['containerimage.digest'];
          if (!/^sha256:[0-9a-f]{64}$/.test(digest)) throw new Error('Digest da imagem ausente.');
          release.frontend_image = 'ghcr.io/pradyumna-001/bancaemdia-frontend@' + digest;
          await writeFile('.staging-release/release.json', JSON.stringify(release, null, 2) + '\n');
          JS
      - name: Preparar acesso verificado ao host autorizado
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          SESSION_COOKIE: ${{ secrets.STAGING_SESSION_COOKIE }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS" && test -n "$SESSION_COOKIE"
          mkdir -m 700 .staging-ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > .staging-ssh/key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > .staging-ssh/known_hosts
          chmod 600 .staging-ssh/key .staging-ssh/known_hosts
      - name: Subir somente o frontend e preservar o release anterior
        id: apply
        run: |
          set -euo pipefail
          target="$STAGING_SSH_USER@$STAGING_SSH_HOST"
          root=/srv/bancaemdia-frontend/staging
          transaction="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_args=(-i .staging-ssh/key -o UserKnownHostsFile=.staging-ssh/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15)
          ssh "${ssh_args[@]}" "$target" "test -d '$root' && mkdir -p '$root/incoming/$transaction'"
          scp "${ssh_args[@]}" .staging-release/release.json "$target:$root/incoming/$transaction/release.json"
          scp "${ssh_args[@]}" deploy/staging/host.py deploy/staging/compose.yml "$target:$root/"
          ssh "${ssh_args[@]}" "$target" "python3 '$root/host.py' apply '$transaction' --release '$root/incoming/$transaction/release.json'"
      - name: Verificar TLS, sessão/API reais, versão, CSP e F5 nos dois viewports
        env:
          STAGING_SESSION_COOKIE: ${{ secrets.STAGING_SESSION_COOKIE }}
        run: node scripts/staging-smoke.mjs
      - name: Confirmar promoção após o smoke real
        run: |
          set -euo pipefail
          ssh -i .staging-ssh/key -o UserKnownHostsFile=.staging-ssh/known_hosts \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "python3 /srv/bancaemdia-frontend/staging/host.py commit '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'"
      - name: Restaurar candidato se aplicação ou smoke falhar
        if: always() && (failure() || cancelled()) && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        run: |
          set -euo pipefail
          ssh -i .staging-ssh/key -o UserKnownHostsFile=.staging-ssh/known_hosts \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" \
            "python3 /srv/bancaemdia-frontend/staging/host.py abort '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'"
      - name: Guardar somente metadados públicos e resultado sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            .staging-release/release.json
            .staging-release/smoke.json
