name: E2E produto completo

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: produto-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produto:
    name: E2E produto real (${{ matrix.browser }}, ${{ github.event_name }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IDENTITY_API_SHA: 25825111bc84126eb48841641adbb47385becf4f
      APP_ENV: testing
      JWT_ALGORITHM: RS256
      JWT_AUDIENCE: bancaemdia-api
      JWT_ISSUER: bancaemdia-api
      JWT_SECRET_KEY: unused-for-rs256-acceptance
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_STORAGE: memory://
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pradyumna-001/bancaemdia-api
          ref: ${{ env.IDENTITY_API_SHA }}
          path: .identity-api
          persist-credentials: false
      - name: Conferir versão única do backend de sandbox
        run: |
          test "$(git -C .identity-api rev-parse HEAD)" = "$IDENTITY_API_SHA"
          test "$(python3 -c 'import json; print(json.load(open("config/api-contract.json"))["commit"])')" = "$IDENTITY_API_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.34.6
      - run: make install build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.identity-api[dev]'
      - run: ruff check tests/identity && ruff format --check tests/identity
      - name: Provar limpeza do ambiente antes e depois do bootstrap
        run: python -m pytest -c .identity-api/pyproject.toml --noconftest -o addopts='' --import-mode=importlib tests/identity/test_harness_resources.py --no-cov -n 0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Gerar credenciais exclusivamente descartáveis e mascaradas
        shell: bash
        run: |
          set -euo pipefail
          db_password=$(openssl rand -hex 24)
          admin_password=$(openssl rand -hex 24)
          echo "::add-mask::$db_password"
          echo "::add-mask::$admin_password"
          echo "POSTGRES_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "KC_BOOTSTRAP_ADMIN_USERNAME=identity-admin-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+asyncpg://identity_test:$db_password@127.0.0.1:55432/bancaemdia_identity" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+asyncpg://identity_test:$db_password@127.0.0.1:55432/bancaemdia_identity" >> "$GITHUB_ENV"
          echo "DATABASE_URL_REPLICA=postgresql+asyncpg://identity_test:$db_password@127.0.0.1:55432/bancaemdia_identity" >> "$GITHUB_ENV"
      - run: docker compose -f .identity-api/tests/identity/docker-compose.yml up -d --wait postgres mailpit
      - run: docker compose -f .identity-api/tests/identity/docker-compose.yml up -d issuer
      - run: docker compose -f tests/identity/upload-compose.yml up -d --wait redis
      - name: Provar identidade, quatro calculadoras e Telegram em cada navegador
        working-directory: .identity-api
        env:
          PRODUCT_BROWSER: ${{ matrix.browser }}
        run: |
          python -m pytest -c pyproject.toml -n 0 --import-mode=importlib -p tests.conftest ../tests/identity/test_browser_contract.py --junitxml=product-identity-results.xml --tb=short -v
          python ../tests/identity/check_results.py product-identity-results.xml
      - name: Provar duplicidade Casa × Telegram e Hipotética no produto conjunto
        working-directory: .identity-api
        env:
          CORE_TRACE_DIR: ${{ github.workspace }}/.identity-api
        run: |
          python -m pytest -c pyproject.toml -n 0 --import-mode=importlib -p tests.conftest ../tests/identity/test_product_contract.py -k '${{ matrix.browser }}' --junitxml=product-matching-results.xml --tb=short -v
          python -m pytest -c pyproject.toml -n 0 --import-mode=importlib -p tests.conftest ../tests/identity/test_hipotetica_contract.py -k '${{ matrix.browser }}' --junitxml=product-hypothesis-results.xml --tb=short -v
          python ../tests/identity/check_product_results.py . '${{ matrix.browser }}' '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Provar invariantes da Hipotética e consolidação no mesmo PostgreSQL
        if: matrix.browser == 'chromium'
        working-directory: .identity-api
        run: |
          pytest -n 0 tests/integration/test_hipotetica_db.py tests/unit/test_hipotetica.py tests/contract/test_hipotetica_contract.py --no-cov --tb=short --junitxml=product-hypothesis-api-results.xml
          python scripts/check_hipotetica_results.py product-hypothesis-api-results.xml
          pytest -n 0 tests/integration/cruzamento/test_consolidacao.py --no-cov --tb=short --junitxml=product-matching-api-results.xml
          python ../tests/identity/check_matching_results.py product-matching-api-results.xml
      - name: Verificar privacidade dos traces antes de publicar
        if: always()
        id: trace_privacy
        working-directory: .identity-api
        run: |
          python ../tests/identity/trace_privacy.py --check-dir .
      - uses: actions/upload-artifact@v4
        if: always() && steps.trace_privacy.outcome == 'success'
        with:
          name: produto-${{ matrix.browser }}-${{ github.event_name }}-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .identity-api/product-*-results.xml
            .identity-api/product-*-report.json
            .identity-api/produto-*.zip
      - name: Encerrar somente o sandbox deste job
        if: always()
        run: |
          docker compose -f tests/identity/upload-compose.yml down
          docker compose -f .identity-api/tests/identity/docker-compose.yml down
