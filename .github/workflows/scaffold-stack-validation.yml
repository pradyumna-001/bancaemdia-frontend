name: Temporary issue 1 local stack validation

on:
  push:
    branches: [feat/1-repository-scaffold-tooling]
    paths: ['.github/workflows/scaffold-stack-validation.yml']

permissions:
  contents: read

jobs:
  local-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare an isolated checkout of the published API
        shell: bash
        run: |
          set -euo pipefail
          api_dir="$RUNNER_TEMP/bancaemdia-api"
          git clone --quiet https://github.com/pradyumna-001/bancaemdia-api.git "$api_dir"
          git -C "$api_dir" checkout --detach bd055417459f796fed960b5b37efb33a9744419f
          echo "API_DIR=$api_dir" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          password = secrets.token_hex(16)
          settings = {
              'APP_ENV': 'testing',
              'POSTGRES_USER': 'bancaemdia',
              'POSTGRES_PASSWORD': password,
              'POSTGRES_DB': 'bancaemdia',
              'DATABASE_URL': f'postgresql+asyncpg://bancaemdia:{password}@postgres:5432/bancaemdia',
              'DATABASE_URL_REPLICA': f'postgresql+asyncpg://bancaemdia:{password}@postgres:5432/bancaemdia',
              'REDIS_URL': 'redis://redis:6379/0',
              'COLETA_TOKEN_SECRET': secrets.token_hex(32),
              'JWT_SECRET_KEY': secrets.token_hex(32),
              'JWT_ISSUER': 'bancaemdia-api',
              'JWT_AUDIENCE': 'bancaemdia-api',
              'OTEL_EXPORTER_OTLP_ENDPOINT': '',
          }
          env_file = Path(os.environ['RUNNER_TEMP']) / 'bancaemdia-api' / '.env'
          env_file.write_text(''.join(f'{key}={value}\n' for key, value in settings.items()))
          PY
      - name: Exercise make up with the real API Compose
        shell: bash
        run: |
          set -euo pipefail
          make up API_DIR="$API_DIR"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health -o /tmp/health.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/openapi.json -o /tmp/openapi.json
          curl --fail --silent http://127.0.0.1:8080/ -o /tmp/frontend.html
          grep -q bancaemdia /tmp/frontend.html
          docker compose --project-directory "$API_DIR" --env-file "$API_DIR/.env" -f "$API_DIR/docker-compose.yml" ps
          docker compose ps
      - name: Collect logs and stop the disposable stack
        if: always()
        shell: bash
        run: |
          docker compose logs
          docker compose down
          if [ -n "${API_DIR:-}" ]; then
            docker compose --project-directory "$API_DIR" --env-file "$API_DIR/.env" -f "$API_DIR/docker-compose.yml" logs
            docker compose --project-directory "$API_DIR" --env-file "$API_DIR/.env" -f "$API_DIR/docker-compose.yml" down
          fi
