name: Temporary issue 1 validation

on:
  push:
    branches: [feat/1-repository-scaffold-tooling]
    paths:
      - '.github/workflows/scaffold-validation.yml'
      - 'Dockerfile'
      - 'nginx/**'
      - 'src/**'
      - 'tests/**'
      - '*config*'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.34.6
      - run: make install lint typecheck test build gen-types
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm exec playwright install --with-deps
      - run: make test:e2e
      - run: pipx run pre-commit run --all-files
      - name: Build and verify the non-root image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t bancaemdia-frontend:issue-1 .
          docker compose up -d
          container=$(docker compose ps -q frontend)
          trap 'docker compose logs; docker compose down' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = '101:101'
          test "$(docker exec "$container" id -u)" = '101'
          docker exec "$container" sh -c 'grep -E "^Uid:[[:space:]]+101[[:space:]]+101[[:space:]]+101[[:space:]]+101" /proc/1/status'
          docker exec "$container" nginx -t
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ -o /tmp/index.html; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/rota-de-smoke -o /tmp/fallback.html
          cmp /tmp/index.html /tmp/fallback.html
          curl --fail --silent -D /tmp/index.headers http://127.0.0.1:8080/ -o /dev/null
          grep -i "Cache-Control: no-cache" /tmp/index.headers
          grep -i "Content-Security-Policy: default-src 'self'" /tmp/index.headers
          grep -i "X-Content-Type-Options: nosniff" /tmp/index.headers
          asset=$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' /tmp/index.html)
          test -n "$asset"
          curl --fail --silent -D /tmp/asset.headers "http://127.0.0.1:8080$asset" -o /dev/null
          grep -i 'Cache-Control:.*immutable' /tmp/asset.headers
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = '404'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1-validation
          path: |
            playwright-report/
            test-results/
          retention-days: 7
