map $uri $response_cache {
    default "";
    /config.json "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' '__THEME_HASH__'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control $response_cache always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location = /config.json {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /fontes/ {
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
        expires -1;
    }
}
